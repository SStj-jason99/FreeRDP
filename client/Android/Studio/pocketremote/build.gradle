apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.pocketremote.freerdp'
    compileSdkVersion = rootProject.ext.compileApi
    buildToolsVersion = rootProject.ext.toolsVersion

    defaultConfig {
        applicationId "com.pocketremote.freerdp"
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
        versionCode 1
        versionName "0.1.0"

        // freeRDPCore's own native build is already restricted to this ABI list (see its
        // build.gradle), but that alone doesn't stop *other* ABIs' prebuilt .so from
        // dependencies (e.g. SQLCipher's AAR ships arm64-v8a/armeabi-v7a/x86/x86_64) from
        // being merged into this app's APK. Apply the same filter here so packaging matches
        // what we actually build/ship for.
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters rootProject.ext.abiFilters
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        debug {
            jniDebuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources.excludes.add("META-INF/*.kotlin_module")
        resources.excludes.add("META-INF/versions/**")
    }
}

dependencies {
    implementation project(':freeRDPCore')
    // freeRDPCore declares these as 'implementation' internally, so its Room/AppCompat
    // API surface (AppDatabase extends RoomDatabase, SessionActivity extends
    // AppCompatActivity) isn't visible to us transitively - depend on them directly too.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.room:room-runtime:2.8.4'

    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'

    // SSH tunnel to the RDP target (jump-host aware) - pure Java, no native build needed
    implementation 'com.github.mwiede:jsch:2.28.4'

    // Saved host list persistence
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
